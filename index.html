<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --ink: #1c2530; --ink-2: #4a5565; --ink-3: #7d8796;
  --paper: #f2f4f6; --surface: #ffffff; --line: #e1e5ea;
  --a: #2f5da8; --b: #c2506f; --both: #4f7a66;
  --gold: #f0d79c; --danger: #b3402f;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --serif: 'Gowun Batang', 'Nanum Myeongjo', 'Noto Serif KR', serif;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.own-a { --c: var(--a); } .own-b { --c: var(--b); } .own-both { --c: var(--both); }

.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(96px + var(--safe-b)); }

/* 상단: D-day */
.hero { background: var(--ink); color: #fff; padding: calc(var(--safe-t) + 18px) 22px 24px; border-radius: 0 0 28px 28px; }
.htop { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: #c7cfda; }
.names { display: inline-flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; }
.names u { display: block; width: 18px; height: 1px; background: #8f9aab; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: #8791a0; }
.sync.online i { background: #6fcf97; } .sync.error i, .sync.offline i { background: #ff8a7a; }
.dday { margin-top: 22px; font-family: var(--serif); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.02em; color: var(--gold); }
.hdate { margin-top: 10px; font-size: 15px; color: #d7dde6; }
.setdate { margin-top: 22px; border: 1.5px solid var(--gold); color: var(--gold); background: none; border-radius: 999px; padding: 11px 18px; font-weight: 600; }
.prog { height: 6px; background: rgba(255,255,255,.16); border-radius: 3px; margin-top: 24px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .3s ease; }
.ptext { margin-top: 8px; font-size: 13px; color: #c7cfda; }

/* 필터 */
.chips { display: flex; gap: 8px; padding: 18px 18px 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; color: var(--ink-2); }
.chip b { font-weight: 600; color: var(--ink); margin-left: 2px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-pressed="true"] b { color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 2px; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px #fff; }
.hint { margin: 6px 20px 0; font-size: 13px; color: var(--ink-3); }

/* 체크리스트 */
.group { margin-top: 22px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 0 20px 9px; background: none; border: 0; text-align: left; }
.gname { font-family: var(--serif); font-weight: 700; font-size: 20px; }
.gside { display: flex; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink-3); }
.gside .past { color: var(--danger); }
.tasks, .evts { list-style: none; margin: 0; padding: 0; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.task { display: flex; align-items: flex-start; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.check { position: relative; flex: none; width: 26px; height: 26px; margin-top: 1px; padding: 0; border-radius: 50%; border: 2px solid var(--c); background: transparent; display: grid; place-items: center; color: #fff; }
.check::after { content: ''; position: absolute; inset: -10px; }
.check svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.done .check { background: var(--c); } .done .check svg { opacity: 1; }
.tbody { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; display: block; }
.ttitle { display: block; font-size: 16px; overflow-wrap: anywhere; }
.done .ttitle { color: var(--ink-3); text-decoration: line-through; }
.tmeta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: 13px; color: var(--ink-3); }
.who { color: var(--c); font-weight: 600; }
.late { color: var(--danger); font-weight: 600; }
.empty { margin: 48px 28px; text-align: center; color: var(--ink-3); }

.tcol { flex: 1; min-width: 0; }
.tnote { display: block; margin-top: 3px; font-size: 14px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.tmeta { align-items: center; }
.whobtn { border: 1.5px solid var(--c); color: var(--c); background: none; border-radius: 999px; padding: 1px 11px; font-size: 13px; font-weight: 600; }
.done .whobtn { opacity: .55; }
.editbtn { flex: none; width: 36px; height: 36px; margin: -5px -9px 0 0; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
.editbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* D-DAY */
.ddhero { margin-top: 18px; padding: 22px 20px; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ddhero h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 24px; }
.ddhero p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
.cd { display: flex; gap: 10px; }
.cd span { flex: 1; text-align: center; border: 1px solid var(--line); border-radius: 12px; padding: 14px 0 12px; font-size: 14px; color: var(--ink-2); }
.cd b { display: block; font-family: var(--serif); font-size: 36px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
.cd span.cheer { font-family: var(--serif); font-size: 20px; color: var(--ink); }
.tl { list-style: none; margin: 0; padding: 0; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tl li { display: flex; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl .tld { flex: none; width: 62px; font-family: var(--serif); font-weight: 700; font-size: 17px; }
.tl .past { opacity: .5; }
.tl .wedrow { background: #fbf4e2; }
.tl .done .ttitle { text-decoration: line-through; color: var(--ink-3); }

/* 달력 */
.cal { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 10px 10px; }
.chead { display: flex; align-items: center; justify-content: space-between; padding: 18px 10px 8px; }
.chead h2 { margin: 0; font-family: var(--serif); font-size: 22px; }
.cbtns { display: flex; gap: 6px; }
.icon-btn { min-width: 38px; height: 38px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 14px; }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
.dow span { text-align: center; font-size: 12px; color: var(--ink-3); padding: 6px 0; }
.dow span:first-child { color: var(--danger); }
.day { height: 56px; padding: 4px 0 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
.day:nth-child(7n+1) .dn { color: var(--danger); }
.day.out { opacity: .38; }
.day.today .dn { box-shadow: inset 0 0 0 1.5px var(--ink); }
.day.wed .dn { background: var(--gold); color: var(--ink); font-weight: 700; }
.day.sel .dn { background: var(--ink); color: #fff; }
.day.sel.wed .dn { color: var(--gold); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.dots i.sq { border-radius: 1px; }
.legend { display: flex; gap: 16px; padding: 8px 10px 0; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 8px; height: 8px; background: var(--ink-3); border-radius: 50%; margin-right: 5px; }
.legend i.sq { border-radius: 1px; } .legend i.w { background: var(--gold); box-shadow: 0 0 0 1px var(--ink-3); }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 9px; }
.dayhead h3 { margin: 0; font-family: var(--serif); font-size: 20px; }
.dayhead span { font-size: 13px; color: var(--ink-3); }
.evt { display: flex; gap: 14px; align-items: flex-start; width: 100%; padding: 13px 20px; border: 0; border-top: 1px solid var(--line); border-left: 4px solid var(--c); background: none; text-align: left; }
.evt:first-child { border-top: 0; }
.etime { flex: none; width: 48px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 1px; }
.subhead { margin: 0; padding: 12px 20px 6px; font-size: 13px; color: var(--ink-3); background: var(--surface); border-top: 1px solid var(--line); }

/* 예산 */
.ledger { margin: 18px 0 0; padding: 4px 20px; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ledger div:first-child { border-top: 0; }
.ledger dt { color: var(--ink-2); } .ledger dd { margin: 0; font-weight: 600; }
.ledger .strong dt { color: var(--ink); font-weight: 600; } .ledger .strong dd { font-size: 20px; font-family: var(--serif); }
.ledger .sub dt { font-size: 14px; } .ledger .sub dd { font-size: 14px; font-weight: 500; }
.amt { flex: none; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.amt small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); }

/* 설정 */
.panel { margin-top: 18px; padding: 18px 20px; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.panel h3 { margin: 0 0 12px; font-family: var(--serif); font-size: 19px; }
.panel p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
.notice { background: #fff6e5; border-color: #f0dcae; }

/* 폼 */
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
  width: 100%; border: 1px solid #cfd5dd; border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
textarea { resize: vertical; }
.segs { display: flex; gap: 8px; }
.seg { position: relative; flex: 1; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span { display: block; text-align: center; padding: 11px 4px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 15px; }
.seg input:checked + span { border-color: var(--c); background: var(--c); color: #fff; }
.seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.checkrow { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 15px; }
.checkrow input { width: 20px; height: 20px; }
.row { display: flex; gap: 10px; margin-top: 8px; }
.grow { flex: 1; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 600; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.kakao { background: #fee500; color: #191919; }
.btn.danger { background: none; color: var(--danger); }
.linkbox { margin-bottom: 12px; }

/* 하단 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.tabs { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-3); }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.fab { position: fixed; z-index: 21; right: max(16px, calc((100vw - 560px) / 2 + 16px)); bottom: calc(76px + var(--safe-b)); width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(28,37,48,.35); }
.fab svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }

.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(20,26,34,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: #fff; border-radius: 22px 22px 0 0; padding: 22px 20px calc(20px + var(--safe-b)); transform: translateY(105%); transition: transform .22s ease; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet h2 { margin: 0 0 18px; font-family: var(--serif); font-size: 22px; }
.sheet .lead { margin: -8px 0 18px; font-size: 14px; color: var(--ink-2); }
.whobtns { display: grid; gap: 10px; }
.whobtns .btn { color: #fff; background: var(--c); font-size: 17px; padding: 16px; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%) translateY(20px); max-width: 86vw; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

const pad = n => String(n).padStart(2, '0');

const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };

const md = s => { const d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };

function randomId(n) {
  const chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const buf = new Uint32Array(n);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  return Array.from(buf, v => chars[v % chars.length]).join('');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 아래 대체 방법 */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

  ta.remove();

}

/* ============================================================
   ④ 저장소 — 체험 모드(LocalStore) / 공유 모드(FirebaseStore)
   ============================================================ */
class LocalStore {
  constructor() {
    this.subs = {}; this.metaSubs = [];
    window.addEventListener('storage', e => { if (e.key && e.key.indexOf('wp.local.') === 0) this._notifyAll(); });
  }
  _get(col) { try { return JSON.parse(localStorage.getItem('wp.local.' + col) || '[]'); } catch (e) { return []; } }
  _set(col, v) { localStorage.setItem('wp.local.' + col, JSON.stringify(v)); }
  _meta() { try { return JSON.parse(localStorage.getItem('wp.local.meta') || 'null'); } catch (e) { return null; } }
  subscribe(col, cb) { (this.subs[col] = this.subs[col] || []).push(cb); cb(this._get(col)); }
  subscribeMeta(cb) { this.metaSubs.push(cb); cb(this._meta()); }
  upsert(col, item) {
    const list = this._get(col);
    const i = list.findIndex(x => x.id === item.id);
    if (i >= 0) list[i] = Object.assign({}, list[i], item); else list.push(item);
    this._set(col, list); this._notify(col);
    return Promise.resolve();
  }
  remove(col, id) { this._set(col, this._get(col).filter(x => x.id !== id)); this._notify(col); return Promise.resolve(); }
  setMeta(patch) { this._set('meta', Object.assign({}, this._meta() || {}, patch)); this.metaSubs.forEach(cb => cb(this._meta())); return Promise.resolve(); }
  _notify(col) { (this.subs[col] || []).forEach(cb => cb(this._get(col))); }
  _notifyAll() { Object.keys(this.subs).forEach(c => this._notify(c)); this.metaSubs.forEach(cb => cb(this._meta())); }
}

class FirebaseStore {
  constructor(room, config) {
    if (!firebase.apps.length) firebase.initializeApp(config);
    this.root = firebase.firestore().collection('rooms').doc(room);
  }
  subscribe(col, cb, onErr) {
    this.root.collection(col).onSnapshot(
      snap => cb(snap.docs.map(d => Object.assign({ id: d.id }, d.data())), snap.metadata), onErr);
  }
  subscribeMeta(cb, onErr) {
    this.root.collection('meta').doc('main').onSnapshot(
      snap => cb(snap.exists ? snap.data() : null, snap.metadata), onErr);
  }
  upsert(col, item) {
    const data = Object.assign({}, item); delete data.id;
    return this.root.collection(col).doc(item.id).set(data, { merge: true });
  }
  remove(col, id) { return this.root.collection(col).doc(id).delete(); }
  setMeta(patch) { return this.root.collection('meta').doc('main').set(patch, { merge: true }); }
}

function groupClosed(key) {
  if (state.closed[key] !== undefined) return state.closed[key];
  const list = state.tasks.filter(t => phaseOf(t) === key);

}

function tasksView() {
  const tasks = state.tasks.slice().sort(cmpTask);
  const left = o => tasks.filter(t => !t.done && (o === 'all' || t.owner === o)).length;

    (c[0] === 'all' ? '' : '<i class="dot own-' + c[0] + '"></i>') + esc(c[1]) + ' <b>' + left(c[0]) + '</b></button>').join('') +
    '<button class="chip" data-act="hide-done" aria-pressed="' + state.hideDone + '">완료 숨기기</button>';

  let body = '';

  } else {
    PHASES.forEach(p => {
      const grp = tasks.filter(t => phaseOf(t) === p.key && (state.filter === 'all' || t.owner === state.filter));
      if (!grp.length) return;
      const remain = grp.filter(t => !t.done).length;
      const rows = grp.filter(t => !(state.hideDone && t.done));
      const closed = groupClosed(p.key);
      const pd = phaseDue(p.key);

      body += '<section class="group"><button class="ghead" data-act="toggle-group" data-phase="' + p.key + '" aria-expanded="' + !closed + '">' +
        '<span class="gname">' + p.label + '</span>' +
        '<span class="gside">' + (past ? '<span class="past">이미 지난 시기</span>' : (pd ? '<span>~ ' + md(pd) + '</span>' : '')) +
        '<span>' + (grp.length - remain) + '/' + grp.length + '</span></span></button>' +
        (closed ? '' : '<ul class="tasks">' + (rows.length ? rows.map(t => taskRow(t)).join('') : '<li class="task"><span class="tmeta">완료한 항목은 숨겨져 있어요</span></li>') + '</ul>') +
        '</section>';
    });

  }

}

async function shareLink() {
  const url = shareUrl();
  if (navigator.share) {
    try { await navigator.share({ title: '결혼 준비 노트', text: '결혼 준비, 같이 관리해요', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(url);
  toast(ok ? '링크를 복사했어요. 카카오톡에 붙여넣어 보내세요' : '링크를 길게 눌러 복사해 주세요');
}
function importJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d !== 'object') throw new Error('bad file');
      ['tasks', 'events', 'budget'].forEach(col => (Array.isArray(d[col]) ? d[col] : []).forEach(it => { if (it && it.id) save(col, it); }));
      if (d.meta) store.setMeta({ weddingDate: d.meta.weddingDate || WEDDING_DATE, people: Array.isArray(d.meta.people) ? d.meta.people : DEFAULT_META.people, seeded: true, seedVersion: SEED_VERSION });
      toast('백업을 불러왔어요');
    } catch (e) { console.error(e); toast('백업 파일을 읽지 못했어요'); }
  };
  r.readAsText(file);
}
function exportJson() {
  const data = { exportedAt: new Date().toISOString(), meta: state.meta, tasks: state.tasks, events: state.events, budget: state.budget };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'wedding-backup-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': state.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'go-settings': state.tab = 'settings'; render(); window.scrollTo(0, 0); break;
    case 'filter': state.filter = el.dataset.filter; render(); break;
    case 'hide-done': state.hideDone = !state.hideDone; render(); break;
    case 'toggle-group': state.closed[el.dataset.phase] = !groupClosed(el.dataset.phase); render(); break;
    case 'toggle-task': {
      const t = state.tasks.find(x => x.id === id); if (!t) break;
      const ph = phaseOf(t); state.closed[ph] = groupClosed(ph);
      save('tasks', { id, done: !t.done, doneBy: !t.done ? state.me : '' });
      break;
    }
    case 'edit-task': taskSheet(id); break;
    case 'edit-event': eventSheet(id); break;
    case 'edit-budget': budgetSheet(id); break;
    case 'toggle-paid': { const b = state.budget.find(x => x.id === id); if (b) save('budget', { id, paid: !b.paid }); break; }
    case 'day': {
      state.sel = el.dataset.date; const d = parse(state.sel);
      state.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); break;
    }
    case 'cal-prev': state.cal = state.cal.m === 0 ? { y: state.cal.y - 1, m: 11 } : { y: state.cal.y, m: state.cal.m - 1 }; render(); break;
    case 'cal-next': state.cal = state.cal.m === 11 ? { y: state.cal.y + 1, m: 0 } : { y: state.cal.y, m: state.cal.m + 1 }; render(); break;
    case 'cal-today': { const n = new Date(); state.sel = todayStr(); state.cal = { y: n.getFullYear(), m: n.getMonth() }; render(); break; }
    case 'pick-who': state.me = el.dataset.who; localStorage.setItem('wp.me', state.me); closeSheet(); render(); break;
    case 'share': shareLink(); break;
    case 'copy-link': copyText(shareUrl()).then(ok => toast(ok ? '링크를 복사했어요' : '링크를 길게 눌러 복사해 주세요')); break;
    case 'export': exportJson(); break;
    case 'import': { const f = $('#imp-file'); if (f) f.click(); break; }
    case 'cycle-owner': {
      const t = state.tasks.find(x => x.id === id); if (!t) break;
      save('tasks', { id, owner: { a: 'b', b: 'both', both: 'a' }[t.owner] || 'a' });
      break;
    }
  }
});

/* ============================================================
   ⑮ 시작
   ============================================================ */
function configured() {
  const c = window.FIREBASE_CONFIG;
  return !!(c && c.apiKey && c.projectId && !/^YOUR_/.test(c.apiKey) && !/^YOUR_/.test(c.projectId));
}
function getRoom() {
  const p = new URLSearchParams(location.search).get('room');
  if (p && /^[A-Za-z0-9_-]{16,64}$/.test(p)) { localStorage.setItem('wp.room', p); return p; }
  let r = localStorage.getItem('wp.room');
  if (!r) { r = randomId(24); localStorage.setItem('wp.room', r); }
  return r;
}
function markSynced(info) {
  if (state.mode !== 'cloud') return;
  state.sync = (info && info.fromCache && !navigator.onLine) ? 'offline' : 'online';
}
function seedIfNeeded(m, info) {
  if (seeding || (m && m.seedVersion === SEED_VERSION) || (info && info.fromCache)) return;
  seeding = true;
  for (let i = 0; i < 29; i++) del('tasks', 'seed-' + i);   // 이전 버전의 기본 목록 정리
  SEED.forEach((s, i) => save('tasks', { id: 'w-' + i, title: s[1], owner: s[2], phase: s[0], due: s[3], note: s[4], done: false, doneBy: '', order: i }));
  Promise.resolve(store.setMeta({ seeded: true, seedVersion: SEED_VERSION })).catch(console.error);
}

function init() {
  state.room = getRoom();
  let cloud = configured();
  if (cloud && !window.firebase) { toast('Firebase를 불러오지 못해 체험 모드로 열었어요'); cloud = false; }
  if (cloud) {
    try { store = new FirebaseStore(state.room, window.FIREBASE_CONFIG); }
    catch (err) { console.error(err); toast('Firebase 연결에 실패해 체험 모드로 열었어요'); cloud = false; }
  }
  if (!cloud) store = new LocalStore();
  state.mode = cloud ? 'cloud' : 'local';
  state.sync = cloud ? 'connecting' : 'local';
  if (cloud) { try { history.replaceState(null, '', location.pathname + '?room=' + state.room + location.hash); } catch (e) { /* 무시 */ } }

  const onErr = err => { console.error(err); state.sync = 'error'; render(); };
  const onList = key => (list, info) => { state[key] = list; markSynced(info); render(); };
  store.subscribe('tasks', onList('tasks'), onErr);
  store.subscribe('events', onList('events'), onErr);
  store.subscribe('budget', onList('budget'), onErr);
  store.subscribeMeta((m, info) => {
    state.meta = Object.assign({}, DEFAULT_META, m || {});
    if (!Array.isArray(state.meta.people) || state.meta.people.length < 2) state.meta.people = DEFAULT_META.people.slice();
    if (!state.meta.weddingDate) state.meta.weddingDate = WEDDING_DATE;
    state.metaLoaded = true; markSynced(info);
    seedIfNeeded(m, info);
    render();
    askWho();
  }, onErr);
  render();
  setInterval(() => { const el = $('#cd'); if (el) el.innerHTML = cdHtml(); }, 30000);
}
init();
})();
</script>
